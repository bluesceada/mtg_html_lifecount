<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTG Life Counter</title>
<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0px;
    overflow: hidden;
    font-family: sans-serif;
    font-size: 16px;
    background: white;
    color: black;
}

#allPlayers {
    position: absolute;
    top: 0px;
    left: 0px;
    width: 100%;
    bottom: 50px; /* Leaves exact room for HUD */
    overflow: hidden;
}

/* Absolute grid cell positioning that bypasses table height bugs */
.grid-cell {
    position: absolute;
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    padding: 0;
    overflow: hidden;
}

.player {
    width: 100%;
    height: 100%;
    text-align: center;
    background: white;
    display: table;
    box-sizing: border-box;
}

.texture {
    display: table-cell;
    vertical-align: middle;
    height: 100%;
}

.box {
    margin: 0;
    padding: 0;
    width: 100%;
    -webkit-box-sizing: border-box;
    background-color: white;
    border: 1px solid black;
}

.playerName {
    width: 85%;
    display: block;
    text-align: center;
    margin: 2px auto 0;
    line-height: 24px;
    font-size: 16px;
}

.lifePanel {
    display: inline-table;
    vertical-align: middle;
    width: 100%;
    table-layout: fixed;
}

.lifePanel .xcrement,
.lifePanel .lifeTotal {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
}

.lifePanel .xcrement { width: 30%; }
.lifePanel .lifeTotal { width: 40%; }

.lifeTotal {
    color: black;
    margin: auto;
    font-size: 280%;
}

button {
    border-radius: 0;
    border: 1px solid black;
    background: white;
    margin: 2px;
    font-size: 16px;
    height: 32px;
    width: 32px;
    color: black;
}

.addBtn {
    display: block;
    width: 56px;
    height: 56px;
    margin: 1px auto;
    font-size: 24px;
}

.densePlayer .addBtn {
    width: 44px;
    height: 44px;
    margin: 1px auto;
    font-size: 21px;
}

.flipBtn {
    font-size: 14px;
    display: block;
    margin: 2px auto;
    width: 70%;
    height: 26px;
}

#commanderOverlay {
    position: absolute;
    left: 5%;
    top: 5%;
    width: 90%;
    height: 90%;
    padding: 8px;
    background: white;
    border: 2px solid black;
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    z-index: 100;
    overflow: auto;
    font-size: 16px;
}

.commanderOverlayTitle {
    text-align: center;
    font-size: 22px;
    line-height: 32px;
}

.commanderClose {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 44px;
    height: 44px;
    font-size: 26px;
}

.commanderToggle {
    display: block;
    width: 90%;
    height: 52px;
    margin: 6px auto;
    font-size: 22px;
}

.commanderDamageGrid {
    position: relative;
    height: 82%;
    margin-top: 8px;
}

.damageRow { white-space: nowrap; }
.damageRow {
    position: absolute;
    padding: 8px;
    margin: 0;
    line-height: 44px;
    text-align: center;
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
}
.damageRow button { height: 44px; width: 44px; font-size: 22px; }
.damageTotal { display: inline-block; min-width: 40px; font-size: 20px; text-align: center; }

.hud {
    height: 50px;
    width: 100%;
    position: absolute;
    bottom: 0;
    left: 0;
    background: white;
    border-top: 1px solid black;
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    padding: 5px;
    z-index: 10;
}

.hud button {
    height: 38px;
    width: auto;
    padding: 0 8px;
    font-size: 14px;
    margin: 2px;
    border-radius: 3px;
    vertical-align: middle;
}

.safeButtons { float: left; display: inline; }
.warningButtons { display: inline; float: right; }
.warningButtons button { background-color: white; border-color: black; color: black; width: auto; height: 38px; padding: 0 10px; font-size: 14px; }
.nextline { display: none; }

</style>
</head>

<body>
    <div id="allPlayers" class="playerSlots"></div>
    <div class="hud">
        <div id="safeButtons" class="safeButtons">
            <button onclick="addPlayer()" class="hudBtn">Add Player</button>
            <button onclick="removePlayer()" class="hudBtn">Remove</button>
            <button onclick="setStartingLife(20)" class="hudBtn">20</button>
            <button onclick="setStartingLife(30)" class="hudBtn">30</button>
            <button onclick="setStartingLife(40)" class="hudBtn">40</button>
            <button onclick="playCommander()" class="hudBtn">Commander</button>
            <button id="rotateToggleButton" onclick="doneEditing()" class="hudBtn">Hide</button>
        </div>
        <div class="warningButtons">
            <button onclick="reset()" class="hudBtn">Reset</button>
        </div>
        <!-- Status message area -->
        <span id="hudMessage" style="color: #ff6666; font-size: 13px; margin-left: 10px; line-height: 38px;"></span>
    </div>
    <script>
    "use strict";

    var numPlayers = 1;

    function addClickHandler(element, handler) {
        if (element.addEventListener) {
            element.addEventListener("click", handler, false);
        } else if (element.attachEvent) {
            element.attachEvent("onclick", handler);
        } else {
            element.onclick = handler;
        }
    }

    function BasePlayer(name) {
        this.name = name;
        this.life = 20;
        this.colors = ["W", "U", "B", "R", "G"];
        this.renderElement = null;
        this.flipped = false;
        this.rotation = 0;
        this.editing = true;
        this.commanderDamage = [];
        this.lifeDisplayElement = null;
        this.renderIndex = 0;
        this.renderPlayers = [];
        this.renderCommanderMode = false;
        this.renderActiveDamagePlayer = -1;
    }

    BasePlayer.unJSON = function(json_obj) {
        var p = new BasePlayer("");
        for (var v in json_obj) {
            if (json_obj.hasOwnProperty(v)) {
                p[v] = json_obj[v];
            }
        }
        return p;
    };

    BasePlayer.prototype.flip = function() {
        this.rotation = (this.rotation + 90) % 360;
    };

    BasePlayer.prototype.clearColors = function() {
        this.colors = [];
    };

    BasePlayer.prototype.refresh = function() {
        if (this.renderElement) {
            this.render(this.renderElement, this.renderIndex, this.renderPlayers, this.renderCommanderMode, this.renderActiveDamagePlayer);
        }
    };

    BasePlayer.prototype.xcrementLife = function(n) {
        this.life += n;
    };

    BasePlayer.prototype.getCommanderDamage = function(opponentIndex) {
        if (typeof this.commanderDamage[opponentIndex] !== "number") {
            this.commanderDamage[opponentIndex] = 0;
        }
        return this.commanderDamage[opponentIndex];
    };

    BasePlayer.prototype.xcrementCommanderDamage = function(opponentIndex, amount) {
        this.commanderDamage[opponentIndex] = this.getCommanderDamage(opponentIndex) + amount;
        if (this.commanderDamage[opponentIndex] < 0) {
            this.commanderDamage[opponentIndex] = 0;
        }
    };

    BasePlayer.prototype.getTotalCommanderDamage = function() {
        var totalDamage = 0;
        for (var opponentIndex = 0; opponentIndex < this.commanderDamage.length; opponentIndex++) {
            if (typeof this.commanderDamage[opponentIndex] === "number") {
                totalDamage += this.commanderDamage[opponentIndex];
            }
        }
        return totalDamage;
    };

    BasePlayer.prototype.getDisplayedLife = function(commanderMode) {
        if (commanderMode) {
            return this.life - this.getTotalCommanderDamage();
        }
        return this.life;
    };

    BasePlayer.prototype.render = function(containingElement, playerIndex, players, commanderMode, activeDamagePlayer) {
        this.renderElement = containingElement;
        this.renderIndex = playerIndex;
        this.renderPlayers = players;
        this.renderCommanderMode = commanderMode;
        this.renderActiveDamagePlayer = activeDamagePlayer;
        while (containingElement.children.length > 0) {
            containingElement.removeChild(containingElement.children[0]);
        }

        var that = this;
        var playerCard = document.createElement("div");
        containingElement.appendChild(playerCard);
        playerCard.className = players.length >= 5 ? "player densePlayer" : "player";
        var rotation = typeof this.rotation === "number" ? this.rotation : (this.flipped ? 180 : 0);
        if (rotation === 90 || rotation === 270) {
            var cellWidth = containingElement.offsetWidth;
            var cellHeight = containingElement.offsetHeight;
            playerCard.style.position = "absolute";
            playerCard.style.left = "50%";
            playerCard.style.top = "50%";
            playerCard.style.width = cellHeight + "px";
            playerCard.style.height = cellWidth + "px";
            playerCard.style.marginLeft = "-" + (cellHeight / 2) + "px";
            playerCard.style.marginTop = "-" + (cellWidth / 2) + "px";
        }
        playerCard.style.webkitTransform = "rotate(" + rotation + "deg)";
        playerCard.style.transform = "rotate(" + rotation + "deg)";

        var textureDiv = document.createElement("div");
        playerCard.appendChild(textureDiv);
        textureDiv.className = "texture";

        var boxDiv = document.createElement("div");
        textureDiv.appendChild(boxDiv);
        boxDiv.className = "box";

        var topHalf = document.createElement("div");
        boxDiv.appendChild(topHalf);
        var bottomHalf = document.createElement("div");
        boxDiv.appendChild(bottomHalf);

        var playerLabel = document.createElement("div");
        topHalf.appendChild(playerLabel);
        playerLabel.className = "playerName";
        playerLabel.innerHTML = "Player " + (playerIndex + 1);

        var lifePanel = document.createElement("div");
        topHalf.appendChild(lifePanel);
        lifePanel.className = "lifePanel";

        var minusDiv = document.createElement("div");
        lifePanel.appendChild(minusDiv);
        minusDiv.className = "xcrement";

        var subs = [-5, -1];
        for (var j = 0; j < subs.length; j++) {
            var btnSub = document.createElement("button");
            btnSub.className = "addBtn";
            minusDiv.appendChild(btnSub);
            btnSub.innerHTML = subs[j];
            (function(nVal) {
                addClickHandler(btnSub, function() {
                    that.xcrementLife(nVal);
                    that.refreshLife();
                });
            })(subs[j]);
        }

        var lifeDisplay = document.createElement("span");
        this.lifeDisplayElement = lifeDisplay;
        lifePanel.appendChild(lifeDisplay);
        lifeDisplay.className = "lifeTotal";
        lifeDisplay.innerHTML = this.getDisplayedLife(commanderMode);

        var plusDiv = document.createElement("div");
        lifePanel.appendChild(plusDiv);
        plusDiv.className = "xcrement";

        var adds = [5, 1];
        for (var i = 0; i < adds.length; i++) {
            var btn = document.createElement("button");
            btn.className = "addBtn";
            plusDiv.appendChild(btn);
            btn.innerHTML = "+" + adds[i];
            (function(nVal) {
                addClickHandler(btn, function() {
                    that.xcrementLife(nVal);
                    that.refreshLife();
                });
            })(adds[i]);
        }

        if (this.editing) {
            var flipButton = document.createElement("button");
            bottomHalf.appendChild(flipButton);
            flipButton.className = "flipBtn";
            flipButton.innerHTML = "Rotate";
            addClickHandler(flipButton, function() {
                that.flip();
                that.refresh();
            });
        }

        if (commanderMode) {
            var commanderToggle = document.createElement("button");
            commanderToggle.className = "commanderToggle";
            commanderToggle.innerHTML = activeDamagePlayer === playerIndex ? "Hide damage" : "Commander Dmg";
            topHalf.appendChild(commanderToggle);
            addClickHandler(commanderToggle, function() {
                if (manager.activeDamagePlayer === playerIndex) {
                    manager.activeDamagePlayer = -1;
                } else {
                    manager.activeDamagePlayer = playerIndex;
                }
                manager.refresh();
            });
        }

        if (commanderMode && activeDamagePlayer === playerIndex) {
            var commanderDiv = document.createElement("div");
            commanderDiv.id = "commanderOverlay";
            document.body.appendChild(commanderDiv);
            var commanderTitle = document.createElement("div");
            commanderTitle.className = "commanderOverlayTitle";
            commanderTitle.innerHTML = "Commander damage";
            commanderDiv.appendChild(commanderTitle);
            var closeButton = document.createElement("button");
            closeButton.className = "commanderClose";
            closeButton.innerHTML = "X";
            commanderDiv.appendChild(closeButton);
            addClickHandler(closeButton, function() {
                manager.activeDamagePlayer = -1;
                manager.refresh();
            });
            var damageGrid = document.createElement("div");
            damageGrid.className = "commanderDamageGrid";
            commanderDiv.appendChild(damageGrid);
            var overlayCols = 2;
            if (players.length === 1) overlayCols = 1;
            var overlayRows = Math.ceil(players.length / overlayCols);
            for (var opponentIndex = 0; opponentIndex < players.length; opponentIndex++) {
                if (opponentIndex === playerIndex) continue;
                var damageRow = document.createElement("div");
                damageRow.className = "damageRow";
                damageRow.innerHTML = "Player " + (opponentIndex + 1);
                var overlayRow = Math.floor(opponentIndex / overlayCols);
                var overlayCol = opponentIndex % overlayCols;
                var overlayItems = (overlayRow === overlayRows - 1) ?
                    (players.length - (overlayRow * overlayCols)) : overlayCols;
                if (players.length === 5 && opponentIndex === 4) {
                    damageRow.style.width = "100%";
                    damageRow.style.left = "0%";
                } else {
                    damageRow.style.width = (100 / overlayItems) + "%";
                    damageRow.style.left = (overlayCol * (100 / overlayCols)) + "%";
                }
                damageRow.style.height = (100 / overlayRows) + "%";
                damageRow.style.top = (overlayRow * (100 / overlayRows)) + "%";
                var damageDown = document.createElement("button");
                damageDown.innerHTML = "-";
                var damageTotal = document.createElement("span");
                damageTotal.className = "damageTotal";
                damageTotal.innerHTML = this.getCommanderDamage(opponentIndex);
                var damageUp = document.createElement("button");
                damageUp.innerHTML = "+";
                damageRow.appendChild(damageDown);
                damageRow.appendChild(damageTotal);
                damageRow.appendChild(damageUp);
                damageGrid.appendChild(damageRow);
                (function(target, index) {
                    addClickHandler(damageDown, function() {
                        target.xcrementCommanderDamage(index, -1);
                        manager.refresh();
                        serializeGameManager(manager);
                    });
                    addClickHandler(damageUp, function() {
                        target.xcrementCommanderDamage(index, 1);
                        manager.refresh();
                        serializeGameManager(manager);
                    });
                })(this, opponentIndex);
            }
        }
    };

    BasePlayer.prototype.refreshLife = function() {
        if (this.lifeDisplayElement !== null) {
            this.lifeDisplayElement.innerHTML = this.getDisplayedLife(this.renderCommanderMode);
        } else {
            this.refresh();
        }
    };

    function PlayerManager() {
        this.players = [];
        this.count = 0;
        this.renderElement = null;
        this.editing = true;
        this.commanderMode = false;
        this.activeDamagePlayer = -1;
    }

    PlayerManager.unJSON = function(json_obj) {
        var plist = json_obj["players"];
        var pm = new PlayerManager();
        if (plist) {
            for (var v = 0; v < plist.length; v++) {
                var p = BasePlayer.unJSON(plist[v]);
                pm.loadExistingPlayer(p);
            }
        }
        return pm;
    };

    PlayerManager.prototype.loadExistingPlayer = function(p) {
        this.players.push(p);
        this.count++;
    };

    PlayerManager.prototype.addPlayer = function() {
        var p = new BasePlayer("");
        p.clearColors();
        p.editing = this.editing;
        this.players.push(p);
        this.count++;
    };
    
    PlayerManager.prototype.removePlayer = function() {
        if (this.players.length > 1) {
            this.players.pop();
            this.count--;
            this.render(this.renderElement);
            serializeGameManager(this);
        } else {
            alert("You must keep at least one player.");
        }
    };

PlayerManager.prototype.render = function(containingElement) {
    this.renderElement = containingElement;
    while (containingElement.children.length > 0) {
        containingElement.removeChild(containingElement.children[0]);
    }
    var existingOverlay = document.getElementById("commanderOverlay");
    if (existingOverlay) {
        existingOverlay.parentNode.removeChild(existingOverlay);
    }
    var totalPlayers = this.players.length;

    for (var rotationIndex = 0; rotationIndex < totalPlayers; rotationIndex++) {
        this.players[rotationIndex].rotation = 0;
    }
    if (totalPlayers === 2 || totalPlayers === 3) {
        this.players[0].rotation = 90;
        this.players[1].rotation = 270;
    } else if (totalPlayers === 4 || totalPlayers === 5) {
        this.players[0].rotation = 90;
        this.players[1].rotation = 270;
        this.players[2].rotation = 90;
        this.players[3].rotation = 270;
    } else if (totalPlayers === 6) {
        for (var pairPlayer = 0; pairPlayer < 6; pairPlayer++) {
            this.players[pairPlayer].rotation = pairPlayer % 2 === 0 ? 90 : 270;
        }
    }

    // Six players use two wide columns and three rows for readable controls.
    var cols = 2;
    if (totalPlayers === 1) cols = 1;

    var totalRows = Math.ceil(totalPlayers / cols);
    if (totalRows === 0) totalRows = 1;

    for (var i = 0; i < totalPlayers; i++) {
        var cell = document.createElement("div");
        cell.className = "grid-cell";

        var row = Math.floor(i / cols);
        var col = i % cols;
        var itemsInThisRow = (row === totalRows - 1) ? (totalPlayers - (row * cols)) : cols;

        // If it's a 5-player game and this is the lone 5th player, center it and make it full width
        if (totalPlayers === 5 && i === 4) {
            cell.style.width = "100%";
            cell.style.left = "0%";
        } else {
            cell.style.width = (100 / itemsInThisRow) + "%";
            cell.style.left = (col * (100 / cols)) + "%";
        }

        cell.style.height = (100 / totalRows) + "%";
        cell.style.top = (row * (100 / totalRows)) + "%";

        containingElement.appendChild(cell);
        this.players[i].render(cell, i, this.players, this.commanderMode, this.activeDamagePlayer);
    }
};

    PlayerManager.prototype.refresh = function() {
        if (this.renderElement) {
            this.render(this.renderElement);
        }
    };

    PlayerManager.prototype.reset = function() {
        this.setEditing(true);
        this.commanderMode = false;
        this.count = 0;
        this.players = [];
    };

    PlayerManager.prototype.playCommander = function() {
        this.commanderMode = !this.commanderMode;
        this.activeDamagePlayer = -1;
    };

    PlayerManager.prototype.setStartingLife = function(life) {
        for (var i = 0; i < this.players.length; i++) {
            this.players[i].life = life;
        }
    };

    PlayerManager.prototype.setEditing = function(state) {
        this.editing = state;
        for (var i = 0; i < this.players.length; i++) {
            this.players[i].editing = this.editing;
        }
    };

    var isStorageAvailable = false;
    try {
        if (typeof localStorage !== "undefined") {
            isStorageAvailable = true;
        }
    } catch (e) {
        isStorageAvailable = false;
    }

    var manager = new PlayerManager();
    if (isStorageAvailable) {
        var objStr = localStorage.getItem("savedManager");
        if (objStr !== null) {
            try {
                var item = JSON.parse(objStr);
                manager = PlayerManager.unJSON(item);
            } catch (e) {
                manager = new PlayerManager();
            }
        }
    }

    var container = document.getElementById("allPlayers");
    manager.render(container);

    if (manager.players.length < 4) {
        for (var i = manager.players.length; i < 4; i++) {
            manager.addPlayer();
        }
        manager.refresh();
    }
    function serializeGameManager(target_manager) {
        if (isStorageAvailable) {
            try {
                var serialized = JSON.stringify(target_manager);
                localStorage.setItem("savedManager", serialized);
            } catch (err) {}
        }
    }

    function setSetupButtonsVisible(visible) {
        var safeButtons = document.getElementById("safeButtons");
        for (var buttonIndex = 0; buttonIndex < safeButtons.children.length; buttonIndex++) {
            var button = safeButtons.children[buttonIndex];
            if (button.id !== "rotateToggleButton") {
                button.style.display = visible ? "inline-block" : "none";
            }
        }
    }

    if (!manager.editing) {
        setSetupButtonsVisible(false);
        document.getElementById("rotateToggleButton").innerHTML = "Show";
    }

    var addPlayer = function() {
        var msgElem = document.getElementById("hudMessage");
        if (manager.players.length >= 6) {
            msgElem.innerHTML = "Max 6 players allowed";
            setTimeout(function() {
                msgElem.innerHTML = "";
            }, 3000); // Clears message after 3 seconds
            return;
        }
        msgElem.innerHTML = "";
        manager.addPlayer();
        manager.refresh();
        serializeGameManager(manager);
    };
    
    function removePlayer() {
        manager.removePlayer();
    }

    function playCommander() {
        manager.playCommander();
        manager.refresh();
        serializeGameManager(manager);
    }

    function setStartingLife(life) {
        manager.setStartingLife(life);
        manager.refresh();
        serializeGameManager(manager);
    }

    function reset() {
        if (!confirm("Reset the game?")) {
            return;
        }
        manager.reset();
        for (var j = 0; j < 4; j++) {
            manager.addPlayer();
        }
        setSetupButtonsVisible(true);
        document.getElementById("rotateToggleButton").innerHTML = "Hide";
        manager.refresh();
        serializeGameManager(manager);
    }

    function doneEditing() {
        manager.setEditing(!manager.editing);
        setSetupButtonsVisible(manager.editing);
        document.getElementById("rotateToggleButton").innerHTML = manager.editing ? "Hide" : "Show";
        manager.refresh();
        serializeGameManager(manager);
    }

    setInterval(function() {
        serializeGameManager(manager);
    }, 5000);
    </script>
</body>
</html>
