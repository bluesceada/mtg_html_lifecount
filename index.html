<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui" />
    <title>MTG Life Counter</title>
<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: sans-serif;
    font-size: 16px;
    background: white;
    color: black;
}

#allPlayers {
    position: absolute;
    top: 0px;
    left: 0px;
    width: 100%;
    bottom: 50px; /* Leaves exact room for HUD */
    overflow: hidden;
}

/* Absolute grid cell positioning that bypasses table height bugs */
.grid-cell {
    position: absolute;
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    padding: 4px;
    overflow: hidden;
}

.player {
    width: 100%;
    height: 100%;
    text-align: center;
    background: white;
    display: table;
    box-sizing: border-box;
}

.texture {
    display: table-cell;
    vertical-align: middle;
    height: 100%;
}

.box {
    margin: 1px;
    padding: 0;
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    background-color: white;
    /*border: 1px solid grey;*/
}

.playerName {
    width: 85%;
    display: block;
    text-align: center;
    margin: 2px auto 0;
    line-height: 26px;
    font-size: 20px;
}

.lifePanel {
    display: inline-table;
    vertical-align: middle;
    width: 100%;
    table-layout: fixed;
}

.lifePanel .xcrement {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
}

.lifeTotal {
    display: block;
    width: 100%;
    text-align: center;
    color: black;
    font-size: 280%;
}



.lifeDelta {
    font-size: 85%;
    font-weight: bold;
    color: #777;
    height: 1em;
    line-height: 1em;
    margin-top: 2px;
    visibility: hidden;
}

button {
    border-radius: 3px;
    border: 1px solid black;
    background: white;
    margin: 2px;
    font-size: 16px;
    height: 32px;
    width: 36px;
    color: black;
}

.addBtn {
    display: block;
    width: 85%; /* 60px */
    height: 60px;
    margin: 1px auto;
    font-size: 24px;
}

.densePlayer .addBtn {
    width: 85%; /* 48px */
    height: 52px;
    margin: 1px auto;
    font-size: 22px;
}

.flipBtn {
    position: absolute;
    bottom: 4px;
    right: 4px;
    width: 60px;
    height: 60px;
    font-size: 16px;
    font-weight: bold;
    margin: 0;
    padding: 0;
    z-index: 5;
    background: rgba(255, 255, 255, 0.66); /* Slight transparency if it overlaps */
}

#commanderOverlay {
    position: absolute;
    left: 2%;
    top: 3px;
    width: 96%;
    height: 94%;
    background: white;
    border: 2px solid black;
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    z-index: 100;
    overflow: hidden;
    font-size: 18px;
}

.damageRow.selfSummary {
    display: flex;
    flex-direction: column;
    justify-content: top;
    align-items: center;
    border: 1px solid #555;
    border-radius: 4px;
    margin: 0;
}

.damageRow.selfSummary .lifeTotal {
    font-size: 280%;
    line-height: 1;
}

.damageRow.selfSummary .selfSummaryMeta {
    font-size: 14px;
    color: black;
    margin-top: 4px;
}

.commanderOverlayTitle {
    position: absolute;
    text-align: center;
    font-size: 22px;
    box-sizing: border-box;
    white-space: nowrap;
    overflow: hidden;
}

.commanderClose {
    position: absolute;
    width: 38px;
    height: 38px;
    font-size: 22px;
    line-height: 36px;
    padding: 0;
    margin: 0;
    z-index: 10;
}

.commanderToggle {
    display: block;
    border-color: #777;
    color: black;
    width: 98%;
    height: 48px;
    margin: 6px auto;
    font-size: 20px;
    line-height: 20px;
    padding: 0 0 0 12px;
}

.commanderButton {
    display: inline-flex;
    align-items: center; /* Vertically centers children (text and mini-map) */
    vertical-align: middle;
    justify-content: space-between;
    padding: 0;
    box-sizing: border-box;
    height: 100%;
}

/* Optional wrapper or direct text container if you want explicit padding/centering */
.commanderButtonText {
    display: flex;
    float: left;
    font-size: 16px;
    color: black;
    align-items: center;
    padding-left: 6px; /* Gives the text a little breathing room from the left edge */
    height: 100%;
}

.commanderSummary {
    float: right;
    position: relative;
    width: 44px;
    height: 100%; 
    background: #fff;
    box-sizing: border-box;
    margin-left: auto;
}

.summaryDamage {
    position: absolute;
    box-sizing: border-box;
    -webkit-box-sizing: border-box; /* Added for legacy Android WebKit */
    border: 1px solid #888;
    font-size: 10px;
    -webkit-font-smoothing: antialiased;
    line-height: 1;
    text-align: center;
    overflow: visible;
    display: flex;
    align-items: center;
    justify-content: center;
}

.commanderDamageGrid {
    position: absolute;
    box-sizing: border-box;
}

.damageRow {
    position: absolute;
    padding: 8px;
    margin: 2px;
    line-height: 44px;
    text-align: center;
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    white-space: nowrap;
    /* border: 1px solid black; */
}
.damageRow button { height: 44px; width: 44px; font-size: 22px; }
.damageTotal { display: inline-block; min-width: 40px; font-size: 22px; text-align: center; }

.hud {
    height: 50px;
    width: 100%;
    position: absolute;
    bottom: 0;
    left: 0;
    border-top: 1px solid black;
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    padding: 3px;
    z-index: 10;
    vertical-align: middle;
}

/* HUD in Options mode */
.hud.hidden-mode {
    border-top: none !important;
    border: none !important;
    height: 44px; /* Shrunk height to fit button */
}

.hud button {
    height: 38px;
    width: auto;
    padding: 0 8px;
    font-size: 14px;
    margin: 3px 1px;
    border-radius: 3px;
    vertical-align: middle;
    flex-shrink: 0;
}

/* Center HUD content when editing controls are hidden */
.hud.centered {
    text-align: center;
}

.hud.centered .safeButtons {
    float: none;
    display: inline-block;
}

/* Expand main view when HUD shrinks */
.hud.hidden-mode ~ #allPlayers {
    border: none;
    border-top: none;
    bottom: 30px;
}

.safeButtons {
    display: flex;
    width: 100%;
}

/* safeButtons in Options mode */
.safeButtons.hidden-mode {
    width: auto;
    justify-content: flex-start;
    margin: 0 auto;
}

#rotateToggleButton {
    background: black !important;
    color: white !important;
    font-weight: bold;
    border: 2px solid black;
    border-radius: 4px;
    padding: 0 12px;
}

/* Sleek, e-ink friendly handle */
#rotateToggleButton.bar-mode {
    width: 80%;
    height: 16px;
    margin: 14px auto;
    border: 1px solid #666;
    border-radius: 6px;
    background: transparent !important;
    cursor: pointer;
    padding: 0;
    display: block;
    font-size: 16px;
    line-height: 12px;
    font-weight: bold;
    color: black !important;
    text-align: center;
    box-sizing: border-box;
}

/* Ensure no focus ring remains after tapping */
#rotateToggleButton.bar-mode:focus,
#rotateToggleButton.bar-mode:active {
    outline: none !important;
    border-color: #666;
}

.nextline { display: none; }

</style>
</head>

<body>
    <div class="hud">
        <div id="safeButtons" class="safeButtons">
            <button onclick="addPlayer()" class="hudBtn">Add Player</button>
            <button onclick="removePlayer()" class="hudBtn">Remove</button>
            <button onclick="setStartingLife(20)" class="hudBtn">20</button>
            <button onclick="setStartingLife(30)" class="hudBtn">30</button>
            <button onclick="setStartingLife(40)" class="hudBtn">40</button>
            <button onclick="playCommander()" class="hudBtn">Commander</button>
            <button id="rotateToggleButton" onclick="doneEditing()" class="hudBtn" style="font-weight: bold;">GO!</button>
            <button onclick="reset()" class="hudBtn" style="margin-left: auto;">Reset</button>
        </div>
        <!-- Status message area -->
        <span id="hudMessage" style="color: #444; font-size: 13px; margin-left: 10px; line-height: 38px;"></span>
    </div>
    <div id="allPlayers" class="playerSlots"></div>
    <script>
    "use strict";

    var numPlayers = 4;
    var DEBUG_ENABLED = true; // Set to false to disable debug messages in the HUD

    // skull emoji (utf8 cannot be rotated!)
    // will be used to show a player's death detected by regular or commander dmg
    var skullSvg = '<svg viewBox="0 0 24 24" width="22" height="22" style="vertical-align:-3px; margin-right:4px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;">' +
               '<!-- Schädelkontur -->' +
               '<path d="M9 19h6m-3-3v4M5 9c0-3.86 3.14-7 7-7s7 3.14 7 7c0 2.21-.97 4.21-2.5 5.5-.77.67-1.5 1.5-1.5 2.5h-6c0-1-.73-1.83-1.5-2.5C5.97 13.21 5 11.21 5 9z"/>' +
               '<!-- Augen -->' +
               '<circle cx="9" cy="9" r="1.25" fill="currentColor"/>' +
               '<circle cx="15" cy="9" r="1.25" fill="currentColor"/>' +
               '<!-- Nase -->' +
               '<path d="M12 12v1"/>' +
               '</svg>';

    function addClickHandler(element, handler) {
        if (element.addEventListener) {
            element.addEventListener("click", handler, false);
        } else if (element.attachEvent) {
            element.attachEvent("onclick", handler);
        } else {
            element.onclick = handler;
        }
    }

    function addHoldHandler(element, handler) {
        var holdTimer = null;
        var repeatTimer = null;
        var holding = false;

        function stopHolding() {
            holding = false;
            if (holdTimer !== null) {
                clearTimeout(holdTimer);
                holdTimer = null;
            }
            if (repeatTimer !== null) {
                clearInterval(repeatTimer);
                repeatTimer = null;
            }
        }

        function startHolding(event) {
            if (holding) return;
            holding = true;
            if (event && event.preventDefault) event.preventDefault();
            handler();
            holdTimer = setTimeout(function() {
                repeatTimer = setInterval(handler, 400); // 400 ms increment time
            }, 700);
        }

        if (element.addEventListener) {
            element.addEventListener("mousedown", startHolding, false);
            element.addEventListener("mouseup", stopHolding, false);
            element.addEventListener("mouseout", stopHolding, false);
            element.addEventListener("touchstart", startHolding, false);
            element.addEventListener("touchend", stopHolding, false);
            element.addEventListener("touchcancel", stopHolding, false);
        } else if (element.attachEvent) {
            element.attachEvent("onmousedown", startHolding);
            element.attachEvent("onmouseup", stopHolding);
            element.attachEvent("onmouseout", stopHolding);
        } else {
            element.onmousedown = startHolding;
            element.onmouseup = stopHolding;
            element.onmouseout = stopHolding;
        }
    }

    function BasePlayer(name) {
        this.name = name;
        this.life = 40;
        this.poison = 0;
        this.colors = ["W", "U", "B", "R", "G"];
        this.renderElement = null;
        this.flipped = false;
        this.rotation = 0;
        this.editing = true;
        this.commanderDamage = [];
        this.lifeDisplayElement = null;
        this.renderIndex = 0;
        this.renderPlayers = [];
        this.renderCommanderMode = true;
        this.renderActiveDamagePlayer = -1;
        this.commanderSummaryElements = [];
        this.currentDelta = 0;
        this._deltaTimer = null;
        this.deltaDisplayElement = null;
    }

    BasePlayer.unJSON = function(json_obj) {
        var p = new BasePlayer("");
        for (var v in json_obj) {
            if (json_obj.hasOwnProperty(v)) {
                p[v] = json_obj[v];
            }
        }
        return p;
    };

    BasePlayer.prototype.toJSON = function() {
        return {
            name: this.name,
            life: this.life,
            poison: this.poison,
            colors: this.colors,
            flipped: this.flipped,
            rotation: this.rotation,
            editing: this.editing,
            commanderDamage: this.commanderDamage
        };
    };

    BasePlayer.prototype.isDead = function() {
        // 1. Leben <= 0
        if (this.getDisplayedLife(true) <= 0) return true;
        // 2. Giftmarken >= 10
        if (this.poison >= 10) return true;
        // 3. 21+ Commander Damage von einem einzelnen Gegner
        for (var i = 0; i < this.commanderDamage.length; i++) {
            if (typeof this.commanderDamage[i] === "number" && this.commanderDamage[i] >= 21) {
                return true;
            }
        }
        return false;
    };

    BasePlayer.prototype.flip = function() {
        this.rotation = (this.rotation + 90) % 360;
    };

    BasePlayer.prototype.clearColors = function() {
        this.colors = [];
    };

    BasePlayer.prototype.refresh = function() {
        if (this.renderElement) {
            this.render(this.renderElement, this.renderIndex, this.renderPlayers, this.renderCommanderMode, this.renderActiveDamagePlayer);
        }
    };

    BasePlayer.prototype.xcrementLife = function(n) {
        this.life += n;
        this.showDelta(n);
    };

    BasePlayer.prototype.showDelta = function(n) {
        if (!this.deltaDisplayElement) return;

        if (this._deltaTimer) {
            clearTimeout(this._deltaTimer);
            this.currentDelta += n;
        } else {
            this.currentDelta = n;
        }

        var sign = this.currentDelta > 0 ? "+" : "";
        this.deltaDisplayElement.innerHTML = sign + this.currentDelta;
        this.deltaDisplayElement.style.visibility = "visible";

        var that = this;
        this._deltaTimer = setTimeout(function() {
            if (that.deltaDisplayElement) {
                that.deltaDisplayElement.style.visibility = "hidden";
            }
            that.currentDelta = 0;
            that._deltaTimer = null;
        }, 2500);
    };

    BasePlayer.prototype.xcrementPoison = function(amount) {
        this.poison = (this.poison || 0) + amount;
        if (this.poison < 0) this.poison = 0;
    };

    BasePlayer.prototype.getCommanderDamage = function(opponentIndex) {
        if (typeof this.commanderDamage[opponentIndex] !== "number") {
            this.commanderDamage[opponentIndex] = 0;
        }
        return this.commanderDamage[opponentIndex];
    };

    BasePlayer.prototype.xcrementCommanderDamage = function(opponentIndex, amount) {
        this.commanderDamage[opponentIndex] = this.getCommanderDamage(opponentIndex) + amount;
        if (this.commanderDamage[opponentIndex] < 0) {
            this.commanderDamage[opponentIndex] = 0;
        }
    };

    BasePlayer.prototype.refreshCommanderSummary = function() {
        for (var summaryIndex = 0; summaryIndex < this.commanderSummaryElements.length; summaryIndex++) {
            var opponentIndex = this.commanderSummaryElements[summaryIndex].opponentIndex;
            this.commanderSummaryElements[summaryIndex].element.innerHTML =
                "" + this.getCommanderDamage(opponentIndex);
                //"P" + (opponentIndex + 1) + ":" + this.getCommanderDamage(opponentIndex);
        }
    };

    BasePlayer.prototype.getTotalCommanderDamage = function() {
        var totalDamage = 0;
        for (var opponentIndex = 0; opponentIndex < this.commanderDamage.length; opponentIndex++) {
            if (typeof this.commanderDamage[opponentIndex] === "number") {
                totalDamage += this.commanderDamage[opponentIndex];
            }
        }
        return totalDamage;
    };

    BasePlayer.prototype.getDisplayedLife = function(commanderMode) {
        if (commanderMode) {
            return this.life - this.getTotalCommanderDamage();
        }
        return this.life;
    };

    function renderCommanderSummaryGrid(player, players, playerIndex, rotation, baseCols, baseRows, commanderSummaryContainer) {
        player.commanderSummaryElements = [];
        var isRotated90or270 = (rotation === 90 || rotation === 270);
        var mapCols = isRotated90or270 ? baseRows : baseCols;
        var mapRows = isRotated90or270 ? baseCols : baseRows;

        for (var i = 0; i < players.length; i++) {
            var isSelf = (i === playerIndex);
            var r = Math.floor(i / baseCols);
            var c = i % baseCols;

            var mapR = r;
            var mapC = c;

            if (rotation === 90) {
                mapR = baseCols - 1 - c;
                mapC = r;
            } else if (rotation === 180) {
                mapR = baseRows - 1 - r;
                mapC = baseCols - 1 - c;
            } else if (rotation === 270) {
                mapR = c;
                mapC = baseRows - 1 - r;
            }

            var isLoneTrailingItem = (baseCols === 2 && players.length % 2 !== 0 && i === players.length - 1);
            var cellWidth = 100 / mapCols;
            var cellHeight = 100 / mapRows;
            var cellLeft = mapC * (100 / mapCols);
            var cellTop = mapR * (100 / mapRows);

            if (isLoneTrailingItem) {
                if (isRotated90or270) {
                    cellHeight = 50;
                    cellTop = 25;
                } else {
                    cellWidth = 50;
                    cellLeft = 25;
                }
            }

            var summaryElement = document.createElement("span");
            summaryElement.className = "summaryDamage";
            summaryElement.style.width = cellWidth + "%";
            summaryElement.style.height = cellHeight + "%";
            summaryElement.style.left = cellLeft + "%";
            summaryElement.style.top = cellTop + "%";

            if (isSelf) {
                summaryElement.style.background = "#ccc"; // Gray block for self
            }
            
            commanderSummaryContainer.appendChild(summaryElement);
            
            if (!isSelf) {
                player.commanderSummaryElements.push({
                    opponentIndex: i,
                    element: summaryElement
                });
            }
        }
        player.refreshCommanderSummary();
    }

    BasePlayer.prototype.render = function(containingElement, playerIndex, players, commanderMode, activeDamagePlayer) {
        this.renderElement = containingElement;
        this.renderIndex = playerIndex;
        this.renderPlayers = players;
        this.renderCommanderMode = commanderMode;
        this.renderActiveDamagePlayer = activeDamagePlayer;
        while (containingElement.children.length > 0) {
            containingElement.removeChild(containingElement.children[0]);
        }

        var that = this;
        var playerCard = document.createElement("div");
        containingElement.appendChild(playerCard);
        playerCard.className = players.length >= 5 ? "player densePlayer" : "player";
        var rotation = typeof this.rotation === "number" ? this.rotation : (this.flipped ? 180 : 0);
        if (rotation === 90 || rotation === 270) {
            var cellWidth = containingElement.offsetWidth;
            var cellHeight = containingElement.offsetHeight;
            playerCard.style.position = "absolute";
            playerCard.style.left = "50%";
            playerCard.style.top = "50%";
            playerCard.style.width = cellHeight + "px";
            playerCard.style.height = cellWidth + "px";
            playerCard.style.marginLeft = "-" + (cellHeight / 2) + "px";
            playerCard.style.marginTop = "-" + (cellWidth / 2) + "px";
        }
        playerCard.style.webkitTransform = "rotate(" + rotation + "deg)";
        playerCard.style.transform = "rotate(" + rotation + "deg)";

        var textureDiv = document.createElement("div");
        playerCard.appendChild(textureDiv);
        textureDiv.className = "texture";

        var boxDiv = document.createElement("div");
        textureDiv.appendChild(boxDiv);
        boxDiv.className = "box";

        var topHalf = document.createElement("div");
        boxDiv.appendChild(topHalf);
        var bottomHalf = document.createElement("div");
        boxDiv.appendChild(bottomHalf);

        var playerLabel = document.createElement("div");
        topHalf.appendChild(playerLabel);
        playerLabel.className = "playerName";
        playerLabel.innerHTML = "Player " + (playerIndex + 1);

        var lifePanel = document.createElement("div");
        topHalf.appendChild(lifePanel);
        lifePanel.className = "lifePanel";

        var minusDiv = document.createElement("div");
        lifePanel.appendChild(minusDiv);
        minusDiv.className = "xcrement";

        var subs = [-5, -1];
        for (var j = 0; j < subs.length; j++) {
            var btnSub = document.createElement("button");
            btnSub.className = "addBtn";
            minusDiv.appendChild(btnSub);
            btnSub.innerHTML = subs[j];
            (function(nVal) {
                addHoldHandler(btnSub, function() {
                    that.xcrementLife(nVal);
                    that.refreshLife();
                });
            })(subs[j]);
        }

        var lifeContainer = document.createElement("div");
        lifePanel.appendChild(lifeContainer);
        lifeContainer.style.display = "table-cell";
        lifeContainer.style.verticalAlign = "middle";
        lifeContainer.style.textAlign = "center";
        lifeContainer.style.width = "38%";

        var lifeDisplay = document.createElement("span");
        this.lifeDisplayElement = lifeDisplay;
        lifeContainer.appendChild(lifeDisplay);
        lifeDisplay.className = "lifeTotal";
        lifeDisplay.innerHTML = this.getDisplayedLife(commanderMode);

        var deltaDisplay = document.createElement("div");
        this.deltaDisplayElement = deltaDisplay;
        deltaDisplay.className = "lifeDelta";
        lifeContainer.appendChild(deltaDisplay);
        var plusDiv = document.createElement("div");
        lifePanel.appendChild(plusDiv);
        plusDiv.className = "xcrement";

        var adds = [5, 1];
        for (var i = 0; i < adds.length; i++) {
            var btn = document.createElement("button");
            btn.className = "addBtn";
            plusDiv.appendChild(btn);
            btn.innerHTML = "+" + adds[i];
            (function(nVal, button) {
                addHoldHandler(button, function() {
                    that.xcrementLife(nVal);
                    that.refreshLife();
                });
            })(adds[i], btn);
        }

        if (this.editing) {
            var flipButton = document.createElement("button");
            // bottomHalf.appendChild(flipButton);
            // boxDiv.appendChild(flipButton);
            containingElement.appendChild(flipButton); // Appends to unrotated grid cell
            flipButton.className = "flipBtn";
            flipButton.innerHTML = "&#8634;";

            addClickHandler(flipButton, function() {
                that.flip();
                that.refresh();
                queueSave(manager);
            });
        }

        if (commanderMode) {
            var commanderToggle = document.createElement("button");
            commanderToggle.className = "commanderToggle";
            var commanderLabel = document.createElement("span");
            commanderLabel.innerHTML = activeDamagePlayer === playerIndex ? "Hide damage" : "Commander Dmg";
            commanderLabel.className = "commanderButtonText";
            commanderToggle.appendChild(commanderLabel);
            var commanderSummary = document.createElement("span");
            commanderSummary.className = "commanderSummary";
            commanderToggle.appendChild(commanderSummary);

            // tiny summary of commander damage
            this.commanderSummaryElements = [];
            var baseCols = (players.length === 1) ? 1 : 2;
            var baseRows = Math.ceil(players.length / baseCols);

            var isRotated90or270 = (rotation === 90 || rotation === 270);
            var mapCols = isRotated90or270 ? baseRows : baseCols;
            var mapRows = isRotated90or270 ? baseCols : baseRows;

            // Populate the mini-map grid via the helper function
            renderCommanderSummaryGrid(this, players, playerIndex, rotation, baseCols, baseRows, commanderSummary);

            topHalf.appendChild(commanderToggle);
            addClickHandler(commanderToggle, function() {
                if (manager.activeDamagePlayer === playerIndex) {
                    manager.activeDamagePlayer = -1;
                } else {
                    manager.activeDamagePlayer = playerIndex;
                }
                manager.refresh();
            });
        }

        if (commanderMode && activeDamagePlayer === playerIndex) {
            var commanderDiv = document.createElement("div");
            commanderDiv.id = "commanderOverlay";
            document.body.appendChild(commanderDiv);

            var overlayRotation = typeof this.rotation === "number" ? this.rotation : 0;
            var overlayW = commanderDiv.clientWidth;
            var overlayH = commanderDiv.clientHeight;
            var titleThickness = 44;

            var commanderTitle = document.createElement("div");
            commanderTitle.className = "commanderOverlayTitle";
            commanderTitle.innerHTML = "Commander damage";
            commanderDiv.appendChild(commanderTitle);
            
            var closeButton = document.createElement("button");
            closeButton.className = "commanderClose";
            closeButton.innerHTML = "X";
            commanderDiv.appendChild(closeButton);
            addClickHandler(closeButton, function() {
                manager.activeDamagePlayer = -1;
                manager.refresh();
            });

            var damageGrid = document.createElement("div");
            damageGrid.className = "commanderDamageGrid";
            commanderDiv.appendChild(damageGrid);

            var gridX = 0;
            var gridY = 0;
            var gridW = overlayW;
            var gridH = overlayH;

            if (overlayRotation === 90) {
                commanderTitle.style.width = overlayH + "px";
                commanderTitle.style.height = titleThickness + "px";
                commanderTitle.style.lineHeight = titleThickness + "px";
                commanderTitle.style.left = (overlayW - titleThickness / 2) + "px";
                commanderTitle.style.top = (overlayH / 2) + "px";
                commanderTitle.style.marginLeft = "-" + (overlayH / 2) + "px";
                commanderTitle.style.marginTop = "-" + (titleThickness / 2) + "px";

                closeButton.style.bottom = "3px";
                closeButton.style.right = "3px";

                gridX = 0;
                gridY = 0;
                gridW = overlayW - titleThickness;
                gridH = overlayH;
            } else if (overlayRotation === 180) {
                commanderTitle.style.width = overlayW + "px";
                commanderTitle.style.height = titleThickness + "px";
                commanderTitle.style.lineHeight = titleThickness + "px";
                commanderTitle.style.left = "0px";
                commanderTitle.style.top = (overlayH - titleThickness) + "px";

                closeButton.style.bottom = "3px";
                closeButton.style.left = "3px";

                gridX = 0;
                gridY = 0;
                gridW = overlayW;
                gridH = overlayH - titleThickness;
            } else if (overlayRotation === 270) {
                commanderTitle.style.width = overlayH + "px";
                commanderTitle.style.height = titleThickness + "px";
                commanderTitle.style.lineHeight = titleThickness + "px";
                commanderTitle.style.left = (titleThickness / 2) + "px";
                commanderTitle.style.top = (overlayH / 2) + "px";
                commanderTitle.style.marginLeft = "-" + (overlayH / 2) + "px";
                commanderTitle.style.marginTop = "-" + (titleThickness / 2) + "px";

                closeButton.style.top = "3px";
                closeButton.style.left = "3px";

                gridX = titleThickness;
                gridY = 0;
                gridW = overlayW - titleThickness;
                gridH = overlayH;
            } else {
                commanderTitle.style.width = overlayW + "px";
                commanderTitle.style.height = titleThickness + "px";
                commanderTitle.style.lineHeight = titleThickness + "px";
                commanderTitle.style.left = "0px";
                commanderTitle.style.top = "0px";

                closeButton.style.top = "3px";
                closeButton.style.right = "3px";

                gridX = 0;
                gridY = titleThickness;
                gridW = overlayW;
                gridH = overlayH - titleThickness;
            }

            commanderTitle.style.webkitTransform = "rotate(" + overlayRotation + "deg)";
            commanderTitle.style.transform = "rotate(" + overlayRotation + "deg)";
            closeButton.style.webkitTransform = "rotate(" + overlayRotation + "deg)";
            closeButton.style.transform = "rotate(" + overlayRotation + "deg)";

            damageGrid.style.left = gridX + "px";
            damageGrid.style.top = gridY + "px";
            damageGrid.style.width = gridW + "px";
            damageGrid.style.height = gridH + "px";
            
            var overlayCols = 2;
            if (players.length === 1) overlayCols = 1;
            var overlayRows = Math.ceil(players.length / overlayCols);
            for (var opponentIndex = 0; opponentIndex < players.length; opponentIndex++) {
                var damageRow = document.createElement("div");
                damageRow.className = "damageRow";

                if (opponentIndex === playerIndex) {
                    damageRow.className += " selfSummary";
                    
                    var lifeTitle = document.createElement("p");
                    lifeTitle.innerHTML = "Life Total";

                    var lifeSpan = document.createElement("span");
                    lifeSpan.className = "lifeTotal";
                    
                    var metaSpan = document.createElement("span");
                    metaSpan.className = "selfSummaryMeta";

                    damageRow.appendChild(lifeTitle);
                    damageRow.appendChild(lifeSpan);
                    damageRow.appendChild(metaSpan);
                    
                    this.overlayLifeElement = lifeSpan;
                    this.overlayMetaElement = metaSpan;
                    this.refreshOverlaySelfSummary();
                } else {

                    var playerrow = document.createElement("p");
                    playerrow.innerHTML = "Player " + (opponentIndex + 1);
                    damageRow.appendChild(playerrow);

                    var damageDown = document.createElement("button");
                    damageDown.innerHTML = "-";
                    var damageTotal = document.createElement("span");
                    damageTotal.className = "damageTotal";
                    damageTotal.innerHTML = this.getCommanderDamage(opponentIndex);
                    var damageUp = document.createElement("button");
                    damageUp.innerHTML = "+";
                    damageRow.appendChild(damageDown);
                    damageRow.appendChild(damageTotal);
                    damageRow.appendChild(damageUp);
                    

                    (function(target, index, totalElement, downButton, upButton) {
                        var updateDamage = function(amount) {
                            target.xcrementCommanderDamage(index, amount);
                            totalElement.innerHTML = target.getCommanderDamage(index);
                            target.refreshCommanderSummary();
                            target.refreshLife();
                            target.refreshOverlaySelfSummary();
                            
                            queueSave(manager);
                        };

                        addHoldHandler(downButton, function() { updateDamage(-1); }, 150);
                        addHoldHandler(upButton, function() { updateDamage(1); }, 150);
                    })(this, opponentIndex, damageTotal, damageDown, damageUp);
                }

                damageGrid.appendChild(damageRow);

                var overlayRow = Math.floor(opponentIndex / overlayCols);
                var overlayCol = opponentIndex % overlayCols;
                
                var overlayRows = Math.ceil(players.length / overlayCols);
                var isLastRow = (overlayRow === overlayRows - 1);
                var itemsInThisRow = isLastRow ? (players.length - (overlayRow * overlayCols)) : overlayCols;

                damageRow.style.position = "absolute";

                // Base standard column width on the primary column count so single items don't blow up in size when rotated
                var standardCellW = gridW / overlayCols;
                var cellW = (itemsInThisRow === 1) ? standardCellW : (gridW / itemsInThisRow);
                var cellH = gridH / overlayRows;
                
                var cellX = (itemsInThisRow === 1) ? (gridW - cellW) / 2 : (overlayCol * cellW);
                //var cellX = (itemsInThisRow === 1) ? Math.round((gridW - cellW) / 2) : Math.round(overlayCol * cellW);
                var cellY = overlayRow * cellH;

                var inset = (opponentIndex === playerIndex) ? 8 : 0;
                var rowW = cellW - (inset * 2);
                var rowH = cellH - (inset * 2);

                if (overlayRotation === 90 || overlayRotation === 270) {
                    damageRow.style.width = rowH + "px";
                    damageRow.style.height = rowW + "px";
                    damageRow.style.left = (cellX + cellW / 2) + "px";
                    damageRow.style.top = (cellY + cellH / 2) + "px";
                    damageRow.style.marginLeft = "-" + (rowH / 2) + "px";
                    damageRow.style.marginTop = "-" + (rowW / 2) + "px";
                } else {
                    damageRow.style.width = rowW + "px";
                    damageRow.style.height = rowH + "px";
                    damageRow.style.left = (cellX + inset) + "px";
                    damageRow.style.top = (cellY + inset) + "px";
                    damageRow.style.margin = "0px";
                }

                damageRow.style.webkitTransform = "rotate(" + overlayRotation + "deg)";
                damageRow.style.transform = "rotate(" + overlayRotation + "deg)";
            }
        }
        this.refreshLife();
    };

    BasePlayer.prototype.refreshLife = function() {
        var dead = this.isDead();
        
        // 1. Anzeige auf dem Hauptfeld aktualisieren
        if (this.lifeDisplayElement !== null) {
            var lifeText = this.getDisplayedLife(this.renderCommanderMode);
            // Zeige Totenkopf vor/über den Lebenspunkten, wenn tot
            this.lifeDisplayElement.innerHTML = dead ? (skullSvg + "<br>" + lifeText) : lifeText;
        } else {
            this.refresh();
        }

        // 2. Anzeige im Commander-Overlay (falls geöffnet)
        this.refreshOverlaySelfSummary();
    };

    BasePlayer.prototype.refreshOverlaySelfSummary = function() {
        if (this.overlayLifeElement && this.overlayMetaElement) {
            var dead = this.isDead();
            var lifeText = this.getDisplayedLife(true);
            
            // Im Overlay-Self-Summary: Schädel direkt neben den Netto-Lebenspunkten
            this.overlayLifeElement.innerHTML = dead ? (skullSvg + " " + lifeText) : lifeText;
            this.overlayMetaElement.innerHTML = "Base: " + this.life + " | Cmdr Dmg: -" + this.getTotalCommanderDamage();
        }
    };

    function PlayerManager() {
        this.players = [];
        this.count = 0;
        this.renderElement = null;
        this.editing = true;
        this.commanderMode = true;
        this.activeDamagePlayer = -1;
        this.startingLife = 40;
        this.rotationLayoutCount = -1;
    }

    PlayerManager.unJSON = function(json_obj) {
        var plist = json_obj["players"];
        var pm = new PlayerManager();
        if (plist) {
            for (var v = 0; v < plist.length; v++) {
                var p = BasePlayer.unJSON(plist[v]);
                pm.loadExistingPlayer(p);
            }
        }
        if (typeof pm.startingLife !== "number") {
            pm.startingLife = 40;
        }
        // Load persisted HUD / editing state
        if (typeof json_obj["editing"] === "boolean") {
            pm.setEditing(json_obj["editing"]);
        }

        pm.rotationLayoutCount = pm.players.length;

        return pm;
    };

    PlayerManager.prototype.toJSON = function() {
        var serializedPlayers = [];
        for (var i = 0; i < this.players.length; i++) {
            var p = this.players[i];
            serializedPlayers.push({
                name: p.name,
                life: p.life,
                colors: p.colors,
                flipped: p.flipped,
                rotation: p.rotation,
                editing: p.editing,
                commanderDamage: p.commanderDamage
            });
        }
        return {
            players: serializedPlayers,
            editing: this.editing,
            commanderMode: this.commanderMode,
            startingLife: this.startingLife,
            rotationLayoutCount: this.rotationLayoutCount
        };
    };

    PlayerManager.prototype.loadExistingPlayer = function(p) {
        this.players.push(p);
        this.count++;
    };

    PlayerManager.prototype.addPlayer = function() {
        var p = new BasePlayer("");
        p.life = this.startingLife;
        p.clearColors();
        p.editing = this.editing;
        this.players.push(p);
        this.count++;
        // re-calculate rotation-layout
        this.rotationLayoutCount = -1;
    };
    
    PlayerManager.prototype.removePlayer = function() {
        if (this.players.length > 1) {
            this.players.pop();
            this.count--;
            this.render(this.renderElement);
            queueSave(this);
        } else {
            alert("You must keep at least one player.");
        }
    };

PlayerManager.prototype.render = function(containingElement) {
    this.renderElement = containingElement;
    while (containingElement.children.length > 0) {
        containingElement.removeChild(containingElement.children[0]);
    }
    var existingOverlay = document.getElementById("commanderOverlay");
    if (existingOverlay) {
        existingOverlay.parentNode.removeChild(existingOverlay);
    }
    var totalPlayers = this.players.length;

    if (this.rotationLayoutCount !== totalPlayers) {
        for (var rotationIndex = 0; rotationIndex < totalPlayers; rotationIndex++) {
            this.players[rotationIndex].rotation = 0;
        }
        if (totalPlayers === 2 || totalPlayers === 3) {
            this.players[0].rotation = 90;
            this.players[1].rotation = 270;
        } else if (totalPlayers === 4 || totalPlayers === 5) {
            this.players[0].rotation = 90;
            this.players[1].rotation = 270;
            this.players[2].rotation = 90;
            this.players[3].rotation = 270;
        } else if (totalPlayers === 6) {
            for (var pairPlayer = 0; pairPlayer < 6; pairPlayer++) {
                this.players[pairPlayer].rotation = pairPlayer % 2 === 0 ? 90 : 270;
            }
        }
        this.rotationLayoutCount = totalPlayers;
    }

    // Six players use two wide columns and three rows for readable controls.
    var cols = 2;
    if (totalPlayers === 1) cols = 1;

    var totalRows = Math.ceil(totalPlayers / cols);
    if (totalRows === 0) totalRows = 1;

    for (var i = 0; i < totalPlayers; i++) {
        var cell = document.createElement("div");
        cell.className = "grid-cell";

        var row = Math.floor(i / cols);
        var col = i % cols;
        var itemsInThisRow = (row === totalRows - 1) ? (totalPlayers - (row * cols)) : cols;

        // If it's a lone item, make it slightly wider than standard (e.g., 75%) and center it
        if (itemsInThisRow === 1 && cols > 1) {
            var customWidth = 60; // Adjust this percentage (e.g., between 50 to 80) to taste
            cell.style.width = customWidth + "%";
            cell.style.left = ((100 - customWidth) / 2) + "%";
        } else {
            cell.style.width = (100 / itemsInThisRow) + "%";
            cell.style.left = (col * (100 / cols)) + "%";
        }

        cell.style.height = (100 / totalRows) + "%";
        cell.style.top = (row * (100 / totalRows)) + "%";

        containingElement.appendChild(cell);
        this.players[i].render(cell, i, this.players, this.commanderMode, this.activeDamagePlayer);
    }
};

    PlayerManager.prototype.refresh = function() {
        if (this.renderElement) {
            this.render(this.renderElement);
        }
    };

    PlayerManager.prototype.reset = function() {
        var playerCount = this.players.length;
        if (playerCount < 1) {
            playerCount = 4;
        }
        this.setEditing(true);
        //this.commanderMode = false;
        this.activeDamagePlayer = -1;
        this.count = 0;
        this.players = [];
        this.rotationLayoutCount = -1;
        for (var playerIndex = 0; playerIndex < playerCount; playerIndex++) {
            this.addPlayer();
        }
    };

    PlayerManager.prototype.playCommander = function() {
        this.commanderMode = !this.commanderMode;
        this.activeDamagePlayer = -1;
    };

    PlayerManager.prototype.setStartingLife = function(life) {
        this.startingLife = life;
        this.activeDamagePlayer = -1;
        for (var i = 0; i < this.players.length; i++) {
            this.players[i].life = life;
            this.players[i].commanderDamage = [];
        }
    };

    PlayerManager.prototype.setEditing = function(state) {
        this.editing = state;
        for (var i = 0; i < this.players.length; i++) {
            this.players[i].editing = this.editing;
        }
    };

    var isStorageAvailable = false;
    try {
        if (typeof localStorage !== "undefined") {
            localStorage.setItem("__storageTest__", "1");
            localStorage.removeItem("__storageTest__");
            isStorageAvailable = true;
        }
    } catch (e) {
        isStorageAvailable = false;
    }

    function showHudMessage(msg, durationMs) {
        var msgElem = document.getElementById("hudMessage");
        if (!msgElem || DEBUG_ENABLED === false) return;
        msgElem.innerHTML = msg;
        if (durationMs) {
            setTimeout(function() { msgElem.innerHTML = ""; }, durationMs);
        }
    }

    var manager = new PlayerManager();
    var objStr = null;

    // Try reading from localStorage first, then fallback to Cookie
    if (isStorageAvailable) {
        objStr = localStorage.getItem("savedManager");
    }
    if (!objStr) {
        objStr = getCookie("savedManager");
    }

    if (objStr !== null) {
        try {
            var item = JSON.parse(objStr);
            manager = PlayerManager.unJSON(item);
        } catch (e) {
            manager = new PlayerManager();
            showHudMessage("Save data corrupt, starting fresh", 4000);
        }
    }

    var container = document.getElementById("allPlayers");

    // prevent misrendering layout after reload/recovery from storage
    setSetupButtonsVisible(manager.editing);

    // only on zero players fill it to 4 default
    if (manager.players.length === 0) {
        for (var i = 0; i < 4; i++) {
            manager.addPlayer();
        }
    }

    manager.render(container);

    // Helper functions for cookie persistence
    function setCookie(name, value, days) {
        var expires = "";
        if (days) {
            var date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + (encodeURIComponent(value) || "") + expires + "; path=/";
    }

    function getCookie(name) {
        var nameEQ = name + "=";
        var ca = document.cookie.split(';');
        for (var i = 0; i < ca.length; i++) {
            var c = ca[i];
            while (c.charAt(0) === ' ') c = c.substring(1, c.length);
            if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
        }
        return null;
    }

    function immediateSave(target_manager) {
        try {
            var serialized = JSON.stringify(target_manager);
            // Save to localStorage
            if (isStorageAvailable) {
                localStorage.setItem("savedManager", serialized);
            }
            // Mirror to Cookie (valid for 60 days)
            setCookie("savedManager", serialized, 60);
        } catch (err) {
            showHudMessage("Save failed: " + err.message, 5000);
        }
    }

    var saveTimeout = null;

    function queueSave(target_manager) {
        if (saveTimeout !== null) {
            clearTimeout(saveTimeout);
        }
        // Only serialize and save after short user idle time
        saveTimeout = setTimeout(function() {
            immediateSave(target_manager);
            saveTimeout = null;
        }, 1000);
    }

    function setSetupButtonsVisible(visible) {
        var hud = document.querySelector(".hud");
        var safeButtons = document.getElementById("safeButtons");
        var rotateBtn = document.getElementById("rotateToggleButton");

        for (var buttonIndex = 0; buttonIndex < safeButtons.children.length; buttonIndex++) {
            var button = safeButtons.children[buttonIndex];
            if (button.id !== "rotateToggleButton") {
                button.style.display = visible ? "inline-block" : "none";
            }
        }

        // Toggle HUD layout mode
        if (visible) {
            hud.className = "hud";
            safeButtons.className = "safeButtons";
            rotateBtn.innerHTML = "GO!";
            rotateBtn.classList.remove("bar-mode");
        } else {
            hud.className = "hud hidden-mode";
            safeButtons.className = "safeButtons hidden-mode";
            // magic utf-8 dots
            rotateBtn.innerHTML = "• • •";
            rotateBtn.classList.add("bar-mode");
        }
    }

    setSetupButtonsVisible(manager.editing);

    var addPlayer = function() {
        var msgElem = document.getElementById("hudMessage");
        if (manager.players.length >= 6) {
            msgElem.innerHTML = "Max 6 players allowed";
            setTimeout(function() {
                msgElem.innerHTML = "";
            }, 3000); // Clears message after 3 seconds
            return;
        }
        msgElem.innerHTML = "";
        manager.addPlayer();
        manager.refresh();
        queueSave(manager);
    };

    window.addEventListener("resize", function() {
        if (manager.activeDamagePlayer !== -1) {
            manager.refresh();
        }
    });
    
    function removePlayer() {
        manager.removePlayer();
    }

    function playCommander() {
        manager.playCommander();
        manager.refresh();
        queueSave(manager);
    }

    function setStartingLife(life) {
        manager.setStartingLife(life);
        manager.refresh();
        queueSave(manager);
    }

    function reset() {
        if (!confirm("Reset the game?")) {
            return;
        }
        if (isStorageAvailable) {
            localStorage.removeItem("savedManager");
        }
        manager.reset();
        setSetupButtonsVisible(true);
        //document.getElementById("rotateToggleButton").innerHTML = "Hide";
        manager.refresh();
        immediateSave(manager);
    }

    function doneEditing() {
        manager.setEditing(!manager.editing);
        setSetupButtonsVisible(manager.editing);
        //document.getElementById("rotateToggleButton").innerHTML = manager.editing ? "Hide" : "Options";
        manager.refresh();
        queueSave(manager);
    }

    setInterval(function() {
        immediateSave(manager);
    }, 5000);

    window.addEventListener("pagehide", function() {
        immediateSave(manager);
    });

    document.addEventListener("visibilitychange", function() {
        if (document.visibilityState === "hidden") {
            immediateSave(manager);
        }
    });

    </script>
</body>
</html>
